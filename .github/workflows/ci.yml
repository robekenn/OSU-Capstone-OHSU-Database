name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the older, still-running CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets and sensitive files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit

      - name: Block files AGENTS.md says must never be committed
        run: |
          blocked=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)secrets/|\.(pem|key)$' | grep -vE '\.env\.example$' || true)
          if [ -n "$blocked" ]; then
            echo "::error::These files must not be committed (AGENTS.md, Data safety):"
            echo "$blocked"
            exit 1
          fi
          echo "No blocked file types are tracked."

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose

  app:
    name: App lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # There is no app code yet. Until a package.json exists at the repo
      # root, this job passes with a notice instead of failing.
      # If the team splits the app into folders (for example server/ and
      # client/), change the path checks and add `working-directory`.
      - name: Check for app code
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet, so lint, test and build were skipped."
          fi

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present
